name: Java CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Java 27)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: oracle-openjdk
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile and test all modules
        run: ./gradlew test --no-daemon
      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-test-results
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: warn

  library-consumer:
    name: Verify Maven library consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: oracle-openjdk
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify local publishing and isolated consumer
        run: ./gradlew verifyLibraryConsumer --no-daemon
