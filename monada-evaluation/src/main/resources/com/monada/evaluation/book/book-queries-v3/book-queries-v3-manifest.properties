# Prospective query set book-queries-v3 (issue #186, Phase II 3/10). See docs/experiments/book-corpus-v1/QUERIES-V3.md.
# Fills the 40 slots of the signed book-queries-v3 protocol. Contains no book text: evidence is byte spans plus
# SHA-256 values into the verified normalized body, over the unchanged book-queries-v1 chunk map.
dataset=book-queries-v3
datasetVersion=1
format=monada-book-queries-prospective-dataset
formatVersion=1

# Bindings: the exact protocol bytes and plan this dataset fills
protocol.sha256=845526aa4e75342f7cf1cff6072284910c0039c100d14ecf421b5dc8653cebee
plan.sha256=5dd4c135520c7c1f487ecf39c27dd9e83ad081218c6302745a1e15c0bd392936

# Label files
queries.file=book-queries-v3-queries.psv
queries.sha256=0ea47d1c6b3d33203382dd84dd868fff7107e852bec5f9dfeb8ae9a96bb08710
judgments.file=book-queries-v3-judgments.psv
judgments.sha256=452ef0fc1e72033a22a58832ec34b364ef217cd180d3c9bd2d85f5e1bf218d54
review.file=book-queries-v3-review.psv
review.sha256=61b4161ac0dc3f71c45451b4bd1a8006b78ea6bf0878194285a52175edfe744c

# Authoring: manual reading of the verified normalized body only; no Store, index, encoder or ranking before freeze
authoring.protocol=MANUAL_READING_OF_NORMALIZED_BODY_NO_RETRIEVAL
authoring.retrievalRunsBeforeFreeze=0
authoring.startedAt=2026-10-24
judgment.grades=0=judged non-relevant confounder,1=partial or supporting evidence,2=directly answers

# Every case was drafted by a model: a proposal only, until the human reviewer reads each one against the body
draft.draftedAt=2026-10-24
draft.verification=EACH_DRAFTED_CASE_READ_AGAINST_BODY_AND_APPROVED_BY_REVIEWER

# Human review: PENDING until a named human writes one receipt per case and signs below (see QUERIES-V3.md)
review.status=PENDING_HUMAN_REVIEW

# FINAL_ONLY cases stay closed until a separate, declared final gate
finalGate.status=CLOSED

counts.queries=40
counts.judgments=60
counts.approved=0
