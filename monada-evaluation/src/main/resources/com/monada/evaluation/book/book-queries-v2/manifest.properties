# Judged query set book-queries-v2 (issue #177, Book evaluation follow-up). See docs/experiments/book-corpus-v1/UNJUDGED-REVIEW.md.
# Append-only extension of book-queries-v1: the v1 files are pinned by SHA-256 below, loaded unchanged, never copied.
# Contains no book text: added judgments are byte spans plus SHA-256 values into the verified normalized body.
dataset=book-queries-v2
datasetVersion=2
format=monada-book-queries-extension
formatVersion=1

# Unchanged base generation (book-queries-v1, issue #166): all 32 queries, the DEV/HOLDOUT split and 55 judgments
extends=book-queries-v1
base.manifest.sha256=ec4efab61f53dfdaf15e31304e2d39d9815e821042224cc806c8d8a3b7ea3bbc
base.queries.sha256=9b1b0b222f26932622c9fe38a8d4351a0a637bd41f49319d882152a44fe05e14
base.judgments.sha256=5f129b6e0b8cb0565d9ba13cb6a57c67238403e7cde77e45c702068d6b163968
base.chunkMap.sha256=d3c62fe220a5e8b7ec584c06f44469ec887f08a71d8ed87a94d65f4ec709f017
base.counts.judgments=55

# Post-hoc provenance: the pairs come from a published run of the evaluated system (book-recall-v1, issue #167).
# The review is score-blind, but these labels are not an independent prospective gold standard.
provenance=POST_HOC_RETRIEVAL_SAMPLED_DEV

# Predeclared selection, fixed before any new label; selection.psv is the non-reviewer receipt (rank, score, hub count)
selection.baselineReport=docs/experiments/book-corpus-v1/book-recall-v1-report.txt
selection.baselineReport.sha256=86501f764e985835487a90b05ce5dbbdc2821455c94a97aaf5d443bba1a2ffd2
selection.rule=dev-unjudged-top1-top3-hub-seeded-v1
selection.seed=book-queries-v2|unjudged-review-v1|
selection.target=60
selection.draftedBy=claude
selection.file=selection.psv
selection.sha256=c095247df3d57b568afc15fa12eee9b5efa9bc9ac74f9f7dedd6ecfa9463418d

# Human review: score-blind local worksheet; review.psv holds no book text. This review used the first worksheet,
# which also showed each chunk key and byte range (no rank, score, stratum or label); see UNJUDGED-REVIEW.md.
review.protocol=SCORE_BLIND_WORKSHEET_QUERY_CHUNK_TEXT_KEY_AND_BYTE_RANGE
review.file=review.psv
review.sha256=37dc4627c26edd9a0ff49d1f766672cb2c91293025ab8d9ef64bd415d13b40e6
judgment.grades=0=judged non-relevant confounder,1=partial or supporting evidence,2=directly answers
# Label drafting: the 60 decisions were proposed by Codex (AI-assisted proposal, 2026-10-21, as the worksheet's
# provenance line states). The reviewer states that each proposal was independently reviewed and approved before
# sign-off. draftedBy=NONE would mean the reviewer decided directly, with no draft.
judgment.draftedBy=codex
judgment.draftedAt=2026-10-21
judgment.verification=EACH_DRAFTED_DECISION_REVIEWED_AND_APPROVED_BY_REVIEWER
# REVIEWED only by the human reviewer: every pair decided, reviewer and approver named (neither the selection nor
# the label drafter), ISO date
judgment.reviewStatus=REVIEWED
judgment.reviewer=Steven Rey Sequeira
judgment.reviewedAt=2026-10-21
judgment.approvedBy=stevdrey
# A NO_ANSWER_CONTRADICTED finding blocks REVIEWED until an explicit, versioned policy is accepted here
reclassification.policy=NONE

# Expected counts, recomputed by runBookUnjudgedReview apply and cross-checked by the loader
counts.queries=32
counts.selected=60
counts.selected.TOP1=22
counts.selected.TOP3=24
counts.selected.HUB=4
counts.selected.SAMPLE=10
counts.reviewed=60
counts.pending=0
counts.decision.EVIDENCE=1
counts.decision.CONFOUNDER=59
counts.decision.UNRESOLVED=0
counts.decision.NO_ANSWER_CONTRADICTED=0
counts.added.judgments=60
counts.judgments=115
