source.sizeBytes=151095
source.sha256=b44b499274ef98e0bc12c190ee08d9c63480b7c96946101a540a0cb24b3a944c

# Frozen chunk binding (book-chunking-v1); chunk-map.jsonl is the unmodified sidecar.jsonl of that run
