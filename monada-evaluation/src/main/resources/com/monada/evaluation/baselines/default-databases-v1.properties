# DefaultDatabasesDataset under MonadaMemoryOptions.defaults().
# Exact values are intentional: improvements and regressions both require review.
dataset=default-databases
datasetVersion=1
profile=PRODUCTION_DEFAULTS
tolerance=1e-15
metric.averageHit@1=EXACT:1.0
metric.averageRecall@3=EXACT:1.0
metric.averageRecall@5=EXACT:1.0
metric.meanReciprocalRank=EXACT:1.0
