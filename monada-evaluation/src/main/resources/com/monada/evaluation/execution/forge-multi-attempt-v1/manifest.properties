# Forge multi-attempt evaluation fixture, version 1 (issue #121).
# Synthetic, caller-approved content only: no real repository, no private data, no provider output.
# Every judged value (attempt results, accepted attempts, labels, acceptance, eligibility reasons, the state at the
# cutoff and the relevance of queries) is reviewed data written by hand; nothing is produced by a model or a provider.
# It is separate from forge-experience-v1, which stays unchanged.
fixture=forge-multi-attempt
fixtureVersion=1
provenance=synthetic; manually authored and judged; no scraped or private content
# Opaque project ids, distinct from those of forge-experience-v1.
scope.alpha=multi-project-alpha
scope.beta=multi-project-beta
# Fixed price snapshot (USD per 1,000,000 tokens); only needed to annotate exported samples, no cost is judged here.
price.id=forge-multi-attempt-prices
price.version=1
price.provider=fixture-provider
price.model=fixture-model
price.currency=USD
price.effective=2025-12-01
price.input=2
price.output=10
price.unitSize=1000000
# Recall depth requested per query (library maximum is 50): every finished attempt of a project is recalled.
recall.limit=50
# Export page size: below the executions of each project, so every export traverses continuation pages.
export.pageSize=3
# Cutoff of the second alpha export: the ledger prefix that ends with this event (revision 1 of the m-correct a1
# finish, before its correction, before m-correct a2 and before m-twin-ko). Judged state at the cutoff: cutoff.psv.
cutoff.scope=alpha
cutoff.event=m-correct.a1.fin
