# Forge experience-memory evaluation fixture, version 1 (issue #102).
# Synthetic, caller-approved content only: no real repository, no private data, no provider output.
# Relevance judgments (queries.psv) and expected values (expectations.properties) are reviewed data,
# written by hand; nothing in this fixture is produced by a model or a provider.
fixture=forge-experience
fixtureVersion=1
provenance=synthetic; manually authored and judged; no scraped or private content
scope.alpha=project-alpha
scope.beta=project-beta
# Fixed price snapshot (USD per 1,000,000 tokens). Only input and output tokens are priced.
price.id=forge-fixture-prices
price.version=1
price.provider=fixture-provider
price.model=fixture-model
price.currency=USD
price.effective=2025-12-01
price.input=2
price.output=10
price.unitSize=1000000
# Recall depth requested per query (library maximum is 50) and the K values of the quality metrics.
recall.limit=50
metric.ks=1,3,5
