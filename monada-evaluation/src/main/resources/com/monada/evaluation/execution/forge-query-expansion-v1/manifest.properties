# Bounded query-side lexical expansion table, version 1 (issue #124).
# Evaluation-only: read by QueryExpansionEvaluator in monada-evaluation and nowhere else. It never rewrites stored
# atoms, projections, encoders or query keys; ExecutionMemory.recall and MonadaMemory never see it.
fixture=forge-query-expansion
fixtureVersion=1
provenance=hand-written before the comparison ran; no model, provider, ranking or recall output was used to write it
# Leakage disclosure (also printed by the report): the rules were written with the judged forge-recall-stress-v1
# vocabulary in view, so any improvement is IN-SAMPLE evidence on 25 synthetic experiences, not a generalization claim.
leakage=rules were written with the judged forge-recall-stress-v1 vocabulary in view: every effect is in-sample \
  evidence on 25 synthetic experiences, not a generalization claim; HIGH-risk rules are deliberately risky so the \
  vetoes are exercised
# Hard bounds, checked when the table loads and again on every expansion.
max.rules=24
max.termsPerRule=3
max.addedTermsPerQuery=8
