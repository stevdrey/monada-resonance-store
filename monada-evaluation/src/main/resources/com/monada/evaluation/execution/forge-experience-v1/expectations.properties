# Hand-verified expectations for fixture forge-experience v1 (issue #102). Reviewed data, never generated.
#
# Prices (manifest.properties): input 2 USD and output 10 USD per 1,000,000 tokens, so
#   cost = input * 2 / 1,000,000 + output * 10 / 1,000,000.
# The chain of an accepted execution runs from the first attempt up to and including the accepted attempt,
# failed attempts included. Executions without a validated acceptance have NO cost to an accepted outcome
# (UNAVAILABLE, never zero).
#
# chain.<execution>.input / .output = summed reported tokens of the chain; .cost = USD, or UNAVAILABLE.
# Every execution of the fixture has an entry; the usage is hand-verified for all of them.

# a-inv1: attempt 1 (8000/800) + attempt 2 (6000/600) -> 14000/1400 -> 0.028 + 0.014
chain.a-inv1.input=14000
chain.a-inv1.output=1400
chain.a-inv1.cost=0.042
# a-inv2: 5000/500 -> 0.010 + 0.005
chain.a-inv2.input=5000
chain.a-inv2.output=500
chain.a-inv2.cost=0.015
# a-inv3: 20000/2000 -> 0.040 + 0.020
chain.a-inv3.input=20000
chain.a-inv3.output=2000
chain.a-inv3.cost=0.060
# a-page: (12000+9000+5000)/(1500+1000+500) = 26000/3000 -> 0.052 + 0.030
chain.a-page.input=26000
chain.a-page.output=3000
chain.a-page.cost=0.082
# a-yaml: 7000/700 -> 0.014 + 0.007
chain.a-yaml.input=7000
chain.a-yaml.output=700
chain.a-yaml.cost=0.021
# a-tz: 2500/250 -> 0.005 + 0.0025
chain.a-tz.input=2500
chain.a-tz.output=250
chain.a-tz.cost=0.0075
# b-inv: 4000/400 -> 0.008 + 0.004
chain.b-inv.input=4000
chain.b-inv.output=400
chain.b-inv.cost=0.012
# b-dedup: (10000+8000)/(1000+800) = 18000/1800 -> 0.036 + 0.018
chain.b-dedup.input=18000
chain.b-dedup.output=1800
chain.b-dedup.cost=0.054
# b-dark: 3000/300 -> 0.006 + 0.003
chain.b-dark.input=3000
chain.b-dark.output=300
chain.b-dark.cost=0.009
# b-cold: 6000/600 -> 0.012 + 0.006
chain.b-cold.input=6000
chain.b-cold.output=600
chain.b-cold.cost=0.018
# b-cold2: (6000+7000)/(600+700) = 13000/1300 -> 0.026 + 0.013
chain.b-cold2.input=13000
chain.b-cold2.output=1300
chain.b-cold2.cost=0.039
# b-page: 4500/450 -> 0.009 + 0.0045
chain.b-page.input=4500
chain.b-page.output=450
chain.b-page.cost=0.0135
# b-tokens: 2500/250 -> 0.005 + 0.0025
chain.b-tokens.input=2500
chain.b-tokens.output=250
chain.b-tokens.cost=0.0075
# No validated acceptance (missing TESTS evidence, rejected, imported claim, failed SECURITY gate): there is no
# cutoff, so the chain scope is ALL_RECORDED_NO_ACCEPTANCE and the usage covers EVERY recorded attempt, while the
# cost to an accepted outcome stays UNAVAILABLE (never zero). The usage is still checked, so a calculator that
# dropped or miscounted these attempts cannot pass behind an unavailable cost.
# a-tokens: 3000/300 (1 attempt)
chain.a-tokens.input=3000
chain.a-tokens.output=300
chain.a-tokens.cost=UNAVAILABLE
# a-export: (10000+11000)/(1200+1300) = 21000/2500 (2 attempts, both rejected)
chain.a-export.input=21000
chain.a-export.output=2500
chain.a-export.cost=UNAVAILABLE
# a-import: 2000/200 (imported claim, not validated)
chain.a-import.input=2000
chain.a-import.output=200
chain.a-import.cost=UNAVAILABLE
# b-webhook: (4000+5000)/(400+500) = 9000/900 (2 attempts, rejected)
chain.b-webhook.input=9000
chain.b-webhook.output=900
chain.b-webhook.cost=UNAVAILABLE
# b-backup: 5000/500 (SECURITY failed)
chain.b-backup.input=5000
chain.b-backup.output=500
chain.b-backup.cost=UNAVAILABLE

# Position among the successes of one comparability group (same task, revision, context, constraints, policy),
# in ledger order: a-inv1 and a-inv2 repeat one piece of work, as do b-cold and b-cold2.
ordinal.a-inv1=1
ordinal.a-inv2=2
ordinal.b-cold=1
ordinal.b-cold2=2

# Pairwise comparisons: <scope>:<left>|<scope>:<right>|<conclusion>|<comma separated mismatching fields>.
# Objectives: minimize USD cost, minimize effort; mandatory gate TESTS.
# a-inv2 (0.015 USD, 15 s) beats a-inv1 (0.042 USD, 40 s) on both objectives: the left side dominates.
comparison.1=alpha:a-inv2|alpha:a-inv1|LEFT_DOMINATES|
# Same task and policy, but another context SHA.
comparison.2=alpha:a-inv1|alpha:a-inv3|NOT_COMPARABLE|CONTEXT_FINGERPRINT
# b-cold (0.018 USD, 20 s) beats b-cold2 (0.039 USD, 50 s).
comparison.3=beta:b-cold|beta:b-cold2|LEFT_DOMINATES|
# Identical task, revision, context and policy in two different projects: only the scope differs.
comparison.4=alpha:a-inv1|beta:b-inv|NOT_COMPARABLE|SCOPE
