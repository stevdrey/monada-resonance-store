# Forge recall stress set, version 1 (issue #122).
# Synthetic, caller-approved content only: no real repository, no private data, no provider output.
# It adds judged queries over the UNCHANGED corpus of forge-experience-v1 (issue #102); it records no experience
# of its own and never edits that fixture. The #102 queries are read from forge-experience-v1/queries.psv and
# reported as the BASELINE group, so the stress groups are compared on the same corpus.
fixture=forge-recall-stress
fixtureVersion=1
baseCorpus=forge-experience-v1
provenance=synthetic; manually authored and judged; no scraped or private content
# How relevance was judged (also printed by the report):
judgment.protocol=Relevance was judged by hand from the experience texts in forge-experience-v1/attempts.psv and \
  executions.psv, query by query, BEFORE any recall was run; no ranking, score or model output was used. An \
  experience is relevant when a developer facing the query would want to read it (a failed attempt whose lesson \
  answers the query counts). An experience is judged confusable when it shares the query's surface vocabulary or \
  task but does not answer it (for example the approach a negated query excludes). Unlisted experiences are \
  neither. An empty relevant set means nothing in the corpus answers the query.
judgment.reviewer=pending PR review (author-proposed judgments; changes require a new fixture version)
# Recall depth requested per query (library maximum is 50) and the K values of the metrics. They must equal the
# values of forge-experience-v1 so the BASELINE group reproduces the #102 rankings exactly.
recall.limit=50
metric.ks=1,3,5
