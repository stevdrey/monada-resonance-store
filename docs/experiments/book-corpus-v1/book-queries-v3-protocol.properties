# Prospective query protocol book-queries-v3 (issue #185, Phase II 2/10). See PROSPECTIVE-V3.md.
# Committed before any v3 query is written and before any ranking is inspected. Contains no query text, answer,
# span, score or book byte: only the slot plan, the review semantics and the gates. Validated by BookQueryProtocolV3.
dataset=book-queries-v3
protocolVersion=1
format=monada-book-queries-prospective
formatVersion=1
provenance=PROSPECTIVE_SCORE_BLIND

# Corpus and chunk binding: identical to the frozen book-queries-v1 manifest, whose chunk-map.jsonl v3 spans use
corpus=book-corpus-v1
corpusVersion=1
corpusManifest.sha256=d68aae03a7b4bebdc78d2fe43260adb055d6369d77be9324fb8378ea3a39228f
source.sizeBytes=151095
source.sha256=b44b499274ef98e0bc12c190ee08d9c63480b7c96946101a540a0cb24b3a944c
chunking.policy=book-chunking-v1
chunkMap.sha256=d3c62fe220a5e8b7ec584c06f44469ec887f08a71d8ed87a94d65f4ec709f017
chunksFile.sha256=e1f4ea9dd6dfcfb3225a845855b79476f686b8868b526a45d05fd863a2608a04

# Precommitted slot plan: slot id, category and split for all 40 cases; no text
plan.file=book-queries-v3-plan.psv
plan.sha256=5dd4c135520c7c1f487ecf39c27dd9e83ad081218c6302745a1e15c0bd392936

# Split: per category, rank slot ids by SHA-256(salt + slot); the last counts.<CATEGORY>.FINAL_ONLY are FINAL_ONLY.
# The plan states every assignment explicitly and the validator recomputes the rule and split.digest.
split.method=per-category-sha256-rank-predeclared-final-only-v1
split.salt=book-queries-v3|
split.digest=5600910d58266d1537c8810cb0770e3f47316bb7d1bf701d3ab1c9c30ba8c0ae

# Authoring: manual reading of the verified normalized body only; no Store, index, encoder or ranking before freeze
authoring.protocol=MANUAL_READING_OF_NORMALIZED_BODY_NO_RETRIEVAL
authoring.retrievalRunsBeforeFreeze=0

# FINAL_ONLY cases are never evaluated automatically until a separate, declared final gate (see PROSPECTIVE-V3.md)
finalGate.policy=separate-declared-final-gate-v1
finalGate.initialStatus=CLOSED

# This protocol carries no queries; Phase II 3/10 authors them in a separate dataset manifest
queries.status=NOT_AUTHORED

# Protocol sign-off: drafted by a model, so REVIEWED only after a named human reviewer and approver sign below
protocol.draftedBy=claude
protocol.draftedAt=2026-10-23
protocol.status=PENDING_HUMAN_REVIEW

# Fixed counts (issue #185) and minimums, cross-checked against the plan
counts.slots=40
counts.DEV=28
counts.FINAL_ONLY=12
counts.LITERAL=4
counts.LITERAL.FINAL_ONLY=1
counts.PARAPHRASE=8
counts.PARAPHRASE.FINAL_ONLY=2
counts.NARRATIVE_TEMPORAL=5
counts.NARRATIVE_TEMPORAL.FINAL_ONLY=2
counts.MULTI_EVIDENCE=5
counts.MULTI_EVIDENCE.FINAL_ONLY=2
counts.CONFOUNDER=5
counts.CONFOUNDER.FINAL_ONLY=2
counts.AMBIGUOUS=5
counts.AMBIGUOUS.FINAL_ONLY=1
counts.NO_ANSWER=8
counts.NO_ANSWER.FINAL_ONLY=2
min.NO_ANSWER=8
min.PARAPHRASE=8
min.NARRATIVE_MULTI_DISTRACTOR=8
